<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Gael, Enrique, and Jake - COMP 150</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="nav-brand">Team Project</div>
    <div class="nav-links">
      <a href="#sites">Personal Sites</a>
      <a href="#gallery">Gallery</a>
    </div>
  </nav>

  <!-- Gradient Hero Header -->
  <header class="hero">
    <h1>Team Gael, Enrique, and Jake</h1>
    <p>Welcome to our team project website!</p>
  </header>

  <!-- Main Content Container -->
  <main class="container">

    <!-- Personal Sites Card -->
    <section id="sites" class="card">
      <h2 class="card-title">Team Members' Personal Sites</h2>
      <ul class="sites-list">
        <li><a href="https://qcernas.github.io" target="_blank">Gael Personal Site</a></li>
        <li><a href="https://ezaldana.github.io/" target="_blank">Enrique Personal Site</a></li>
        <li><a href="https://jakeread7.github.io" target="_blank">Jake Personal Site</a></li>
      </ul>
    </section>

    <!-- Gallery Card -->
    <section id="gallery" class="card">
      <h2 class="card-title">Team Images</h2>
      
      <div class="gallery-grid">
        <div class="gallery-item">
          <div class="img-wrapper">
            <img src="photo1.jpg" alt="Team Photo 1">
          </div>
          <p class="caption">Team Photo 1</p>
        </div>

        <div class="gallery-item">
          <div class="img-wrapper">
            <img src="photo2.jpg" alt="Team Photo 2">
          </div>
          <p class="caption">Team Photo 2</p>
        </div>

        <div class="gallery-item">
          <div class="img-wrapper">
            <img src="photo3.jpg" alt="Team Photo 3">
          </div>
          <p class="caption">Team Photo 3</p>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
